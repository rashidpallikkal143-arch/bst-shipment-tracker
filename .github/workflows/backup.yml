name: Daily backup
# Every night about 2 am UAE time: saves all tracker data as a password-protected (AES-256) zip, kept for 90 days.
# Download: Actions > Daily backup > the run > "Artifacts". Open the zip with 7-Zip and the BACKUP_PASSWORD.
on:
  schedule:
    - cron: '7 22 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: tools/backup
        run: npm install --no-audit --no-fund
      - name: Read all data
        working-directory: tools/backup
        env:
          BACKUP_BOT_PASSWORD: ${{ secrets.BACKUP_BOT_PASSWORD }}
          BACKUP_BOT_ID: backup-bot
          OUT: BST-backup.json
        run: node backup.mjs
      - name: Encrypt
        id: enc
        working-directory: tools/backup
        env:
          ZIP_PW: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ -f .skip ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$ZIP_PW" ]; then echo "::error::Add the GitHub secret BACKUP_PASSWORD (the password that protects the backup files)."; exit 1; fi
          NAME="BST-backup-$(TZ=Asia/Dubai date +%Y-%m-%d_%H%M)"
          mv BST-backup.json "$NAME.json"
          7z a -tzip -mem=AES256 -p"$ZIP_PW" "$NAME.zip" "$NAME.json" > /dev/null
          rm -f "$NAME.json"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME.zip"
      - name: Send to the company Google Drive / email
        if: steps.enc.outputs.skip != '1'
        working-directory: tools/backup
        env:
          DRIVE_URL: ${{ secrets.BACKUP_DRIVE_URL }}
          DRIVE_SECRET: ${{ secrets.BACKUP_DRIVE_SECRET }}
          NAME: ${{ steps.enc.outputs.name }}
        run: |
          if [ -z "$DRIVE_URL" ]; then echo "Company Google Drive not set up (secret BACKUP_DRIVE_URL) - backup kept on GitHub only."; exit 0; fi
          node -e 'const fs=require("fs");const n=process.env.NAME;fs.writeFileSync("payload.json",JSON.stringify({secret:process.env.DRIVE_SECRET,name:n,summary:fs.existsSync("summary.txt")?fs.readFileSync("summary.txt","utf8"):"",data:fs.readFileSync(n+".zip").toString("base64")}))'
          ANS=$(curl -sS -L --max-time 240 -H "Content-Type: application/json" --data-binary @payload.json "$DRIVE_URL")
          rm -f payload.json
          echo "Answer: $(echo "$ANS" | head -c 300)"
          echo "$ANS" | grep -q '"ok":true' || { echo "::error::The company Google Drive did not accept the backup (see answer above). The backup is still kept on GitHub."; exit 1; }
      - name: Keep for 90 days
        if: steps.enc.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.enc.outputs.name }}
          path: tools/backup/${{ steps.enc.outputs.name }}.zip
          retention-days: 90
          compression-level: 0
