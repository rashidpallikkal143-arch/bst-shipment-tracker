name: Daily backup
# Every night about 2 am UAE time: saves all tracker data as a password-protected (AES-256) zip, kept for 90 days.
# Download: Actions > Daily backup > the run > "Artifacts". Open the zip with 7-Zip and the BACKUP_PASSWORD.
on:
  schedule:
    - cron: '7 22 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: tools/backup
        run: npm install --no-audit --no-fund
      - name: Read all data
        working-directory: tools/backup
        env:
          BACKUP_BOT_PASSWORD: ${{ secrets.BACKUP_BOT_PASSWORD }}
          BACKUP_BOT_ID: backup-bot
          OUT: BST-backup.json
        run: node backup.mjs
      - name: Encrypt
        id: enc
        working-directory: tools/backup
        env:
          ZIP_PW: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          if [ -f .skip ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$ZIP_PW" ]; then echo "::error::Add the GitHub secret BACKUP_PASSWORD (the password that protects the backup files)."; exit 1; fi
          NAME="BST-backup-$(TZ=Asia/Dubai date +%Y-%m-%d_%H%M)"
          mv BST-backup.json "$NAME.json"
          7z a -tzip -mem=AES256 -p"$ZIP_PW" "$NAME.zip" "$NAME.json" > /dev/null
          rm -f "$NAME.json"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME.zip"
      - name: Keep for 90 days
        if: steps.enc.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.enc.outputs.name }}
          path: tools/backup/${{ steps.enc.outputs.name }}.zip
          retention-days: 90
          compression-level: 0
