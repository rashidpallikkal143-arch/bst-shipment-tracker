name: AIS coverage check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/ais/coverage.mjs
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
