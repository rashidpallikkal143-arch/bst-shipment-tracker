# Builds the Android APK, the Windows installer and the Mac app, and attaches them to a GitHub Release.
# Runs when a version tag like v1.0.1 is pushed, or by hand (Actions > Build apps > Run workflow).
name: Build apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - name: App icon and splash screen
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#00a651' --splashBackgroundColor '#04512c'
        continue-on-error: true
      - run: npx cap sync android
      - name: Use the project's fixed signing key (so new versions install over old ones)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ../BST-Shipment-Tracker-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: BST-Shipment-Tracker-Android.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/*.exe

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: desktop/dist/*.dmg

  release:
    needs: [android, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: BST Shipment Tracker ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          make_latest: true
          body: |
            Download the file for your device:
            - **Android phone:** BST-Shipment-Tracker-Android.apk
            - **Windows PC:** BST-Shipment-Tracker-win-….exe
            - **Mac:** BST-Shipment-Tracker-mac-….dmg
            - **iPhone / iPad:** open the website in Safari, then Share → Add to Home Screen.
          files: out/*
