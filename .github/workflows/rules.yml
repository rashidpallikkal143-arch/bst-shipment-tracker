name: Publish database rules
# Publishes firestore.rules to Firebase whenever it changes (or by hand from the Actions tab).
on:
  push:
    branches: [main]
    paths: ['firestore.rules']
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only firestore:rules --project bst-shipment-tracker --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
